<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
  <link rel="shortcut icon" href="favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
  <link rel="manifest" href="favicon/site.webmanifest" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Modal / Lightbox Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
    }
    .modal-content-wrapper {
      position: relative;
      text-align: center;
      max-width: 85%;
      max-height: 85vh;
    }
    .modal-content-wrapper img {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 8px;
      object-fit: contain;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .modal-caption {
      color: #ffffff;
      margin-top: 15px;
      font-size: 1rem;
      font-weight: 500;
    }
    .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
      z-index: 2001;
      transition: color 0.2s;
    }
    .close-btn:hover {
      color: var(--primary-orange, #ff6b00);
    }
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      font-size: 1.8rem;
      padding: 12px 18px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 2001;
      transition: background 0.3s;
    }
    .nav-arrow:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .nav-prev { left: 20px; }
    .nav-next { right: 20px; }
    
    .gallery-card {
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .gallery-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <script>
    if (sessionStorage.getItem('isLoggedIn') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div>
        <div class="sidebar-header">
          <img src="LOGO.png" alt="Company Logo" class="logo" onerror="this.src='https://via.placeholder.com/180x50?text=Avaniysh+Interior'">
        </div>
        <nav class="sidebar-nav">
          <ul>
            <li>
              <a href="index.html" class="nav-btn active">
                <i class="fa-solid fa-house"></i> <span>Home</span>
              </a>
            </li>
            <li>
              <a href="employee.html" class="nav-btn">
                <i class="fa-solid fa-users"></i> <span>Teams</span>
              </a>
            </li>
            <li>
              <a href="systems.html" class="nav-btn" data-target="system-view">
                <i class="fa-solid fa-gears"></i> <span>Systems</span>
              </a>
            </li>
            <li>
              <a href="documents.html" class="nav-btn">
                <i class="fa-solid fa-file-contract"></i> <span>Company Information</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>

      <!-- Sign Out Button -->
      <div class="sidebar-footer">
        <button class="btn-logout" onclick="logout()">
          <i class="fa-solid fa-right-from-bracket"></i> <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- Home View -->
      <section id="home-view" class="content-view active">
        <header class="page-header flex-header">
          <div>
            <h1>Dashboard</h1>
            <div class="user-profile-badge">
              Welcome, <strong id="logged-in-user-name">Guest</strong>!
            </div>
          </div>
          <!-- Date Display Widget -->
          <div class="date-widget" style="font-weight: 600; color: var(--text-muted);">
            <i class="fa-solid fa-calendar-day" style="color: var(--primary-orange);"></i> 
            <span id="current-date-display">Today</span>
          </div>
        </header>
        <div class="header-divider"></div>

        <!-- Metric Cards -->
        <div class="metrics-grid" style="margin-top: 20px;">
          <div class="metric-card">
            <i class="fa-solid fa-user-group"></i>
            <div>
              <h3>Total Team</h3>
              <p>12</p>
            </div>
          </div>
          <div class="metric-card">
            <i class="fa-solid fa-diagram-project"></i>
            <div>
              <h3>Active Projects</h3>
              <p>8</p>
            </div>
          </div>
          <div class="metric-card">
            <i class="fa-solid fa-handshake"></i>
            <div>
              <h3>Esteemed Clients</h3>
              <p>500+</p>
            </div>
          </div>
          <div class="metric-card">
            <i class="fa-solid fa-file-excel"></i>
            <div>
              <h3>Active Sheets</h3>
              <p>37</p>
            </div>
          </div>
        </div>

        <!-- Active Projects Gallery -->
        <div class="section-block">
          <h2>Recent Project Photos</h2>
          <div class="gallery-grid">
            <div class="gallery-card" onclick="openGallery('airtech')">
              <img src="Projects Images/Airtech.png" alt="Airtech Project Site, Goa" onerror="this.src='https://via.placeholder.com/300x160?text=Goa+Project'">
              <span>Airtech Composite Material Pvt. Ltd.</span>
            </div>
            <div class="gallery-card" onclick="openGallery('standex')">
              <img src="Projects Images/Standex.png" alt="Standex Project Site" onerror="this.src='https://via.placeholder.com/300x160?text=Standex'">
              <span>Standex</span>
            </div>
            <div class="gallery-card" onclick="openGallery('airlife')">
              <img src="Projects Images/Airlife.png" alt="AirLife Gases, Chakan" onerror="this.src='https://via.placeholder.com/300x160?text=AirLife+Chakan'">
              <span>AirLife Gases Pvt. Ltd.</span>
            </div>
            <div class="gallery-card" onclick="openGallery('revata')">
              <img src="Projects Images/Revata.png" alt="Revata Project Site" onerror="this.src='https://via.placeholder.com/300x160?text=Revata'">
              <span>Revata</span>
            </div>
          </div>
        </div>

      </section>

    </main>
  </div>

  <!-- Image Gallery Lightbox Modal -->
  <div id="image-modal" class="modal-overlay" onclick="closeGalleryOnOverlay(event)">
    <span class="close-btn" onclick="closeGallery()">&times;</span>
    <button class="nav-arrow nav-prev" onclick="changePhoto(-1)"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="modal-content-wrapper">
      <img id="modal-img" src="" alt="Project Image">
      <div id="modal-caption" class="modal-caption"></div>
    </div>
    <button class="nav-arrow nav-next" onclick="changePhoto(1)"><i class="fa-solid fa-chevron-right"></i></button>
  </div>

  <script src="script.js"></script>
  <script>
    const projectGalleries = {
      airtech: [
        { src: 'Projects Images/Airtech/1.png', caption: 'Airtech Composite Material' },
        { src: 'Projects Images/Airtech/2.png', caption: 'Airtech Composite Material' },
        { src: 'Projects Images/Airtech/3.png', caption: 'Airtech Composite Material' },
        { src: 'Projects Images/Airtech/4.png', caption: 'Airtech Composite Material' },
        { src: 'Projects Images/Airtech/5.png', caption: 'Airtech Composite Material' },
      ],
      standex: [
        { src: 'Projects Images/Standex/1.png', caption: 'Standex' },
        { src: 'Projects Images/Standex/2.png', caption: 'Standex' },
        { src: 'Projects Images/Standex/3.png', caption: 'Standex' },
        { src: 'Projects Images/Standex/4.png', caption: 'Standex' }
      ],
      airlife: [
        { src: 'Projects Images/Airlife/1.png', caption: 'AirLife Gases Pvt. Ltd.' },
        { src: 'Projects Images/Airlife/2.png', caption: 'AirLife Gases Pvt. Ltd.' },
        { src: 'Projects Images/Airlife/3.png', caption: 'AirLife Gases Pvt. Ltd.' },
        { src: 'Projects Images/Airlife/4.png', caption: 'AirLife Gases Pvt. Ltd.' }
      ],
      revata: [
        { src: 'Projects Images/Revata/1.png', caption: 'Revata' },
        { src: 'Projects Images/Revata/2.png', caption: 'Revata' },
         { src: 'Projects Images/Revata/3.png', caption: 'Revata' }
      ]
    };

    let currentProjectKey = '';
    let currentPhotoIndex = 0;

    function openGallery(projectKey) {
      if (!projectGalleries[projectKey]) return;
      currentProjectKey = projectKey;
      currentPhotoIndex = 0;
      updateModalContent();
      document.getElementById('image-modal').style.display = 'flex';
    }

    function updateModalContent() {
      const gallery = projectGalleries[currentProjectKey];
      const photo = gallery[currentPhotoIndex];
      const imgElem = document.getElementById('modal-img');
      
      imgElem.src = photo.src;
      imgElem.onerror = function() {
        this.src = 'https://via.placeholder.com/600x400?text=Image+Not+Found';
      };
      
      document.getElementById('modal-caption').innerText = 
        `${photo.caption} (${currentPhotoIndex + 1} / ${gallery.length})`;
    }

    function changePhoto(direction) {
      const gallery = projectGalleries[currentProjectKey];
      if (!gallery || gallery.length === 0) return;
      
      currentPhotoIndex = (currentPhotoIndex + direction + gallery.length) % gallery.length;
      updateModalContent();
    }

    function closeGallery() {
      document.getElementById('image-modal').style.display = 'none';
    }

    function closeGalleryOnOverlay(event) {
      if (event.target.id === 'image-modal') {
        closeGallery();
      }
    }

    // Keyboard controls (Arrow keys & Esc key)
    document.addEventListener('keydown', (e) => {
      const modal = document.getElementById('image-modal');
      if (modal.style.display === 'flex') {
        if (e.key === 'ArrowLeft') changePhoto(-1);
        if (e.key === 'ArrowRight') changePhoto(1);
        if (e.key === 'Escape') closeGallery();
      }
    });

    // Set Current Date Automatically
    document.addEventListener('DOMContentLoaded', () => {
      const dateElem = document.getElementById('current-date-display');
      if (dateElem) {
        const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
        dateElem.innerText = new Date().toLocaleDateString('en-US', options);
      }
    });

    function logout() {
      sessionStorage.removeItem('isLoggedIn');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
